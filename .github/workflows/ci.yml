name: CI

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: windows-latest
    timeout-minutes: 45
    env:
      QT_QPA_PLATFORM: offscreen
      STUDIO_LANG: en
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: python -m pip install -r requirements/core.txt -r requirements/test.txt
      - run: python -m ruff check .
      - run: python -m pytest -q
      - run: python -m gs360studio doctor --json
