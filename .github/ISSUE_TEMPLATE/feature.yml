    id: problem
    attributes: {label: Problem or workflow friction}
    validations: {required: true}
  - type: textarea
    id: result
    attributes: {label: Desired result and acceptance criteria}
    validations: {required: true}
  - type: textarea
    id: alternatives
    attributes: {label: Alternatives considered}
