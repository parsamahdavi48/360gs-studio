[project]
name = "gs360studio"
version = "0.1.0"
description = "360GS Studio: a unified 360-degree capture-to-3DGS workstation."
requires-python = ">=3.12"
license = { file = "LICENSE" }
readme = "README.md"
dependencies = [
    "numpy==2.4.4",
    "opencv-python==4.13.0.92",
    "Pillow==12.2.0",
    "PySide6==6.11.0",
]

[project.scripts]
360gs-studio = "gs360studio.cli:main"

[project.urls]
Repository = "https://github.com/stechdrive/360gs-studio"
Issues = "https://github.com/stechdrive/360gs-studio/issues"

[tool.stechdrive-3dgs-utils]
core-requirements = "requirements/core.txt"
torch-requirements = "requirements/torch-cu128.txt"
ml-requirements = "requirements/ml.txt"
test-requirements = "requirements/test.txt"

[tool.gs360studio]
core-requirements = "requirements/core.txt"
test-requirements = "requirements/test.txt"

[tool.setuptools.packages.find]
include = ["core*", "gui*", "gs360studio*", "scripts*"]

[tool.setuptools.package-data]
gs360studio = ["resources/**/*.json"]

[tool.ruff]
target-version = "py312"
line-length = 120
exclude = [
    ".cache",
    ".venv",
    ".venv-*",
    "models",
]

[tool.ruff.lint]
select = [
    "E4",
    "E7",
    "E9",
    "F",
    "I",
    "B",
    "UP",
]
ignore = [
    "E501",
]
